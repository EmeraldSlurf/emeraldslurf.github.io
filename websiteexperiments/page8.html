<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!--This one is also important for scaling to device screen resolution, particularly in the case of phones:-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page 8</title>

    <!--Here are a few basic types of metadata you can add to the page-->
    <meta name="description" content="A few pages about the very basics of html">
    <meta name="keywords" content="HTML, templates, learning">
    <meta name="author" content="Italo">

    <!--Here we can refresh the page after a given interval of time:-->
    <meta http-equiv="refresh" content="30">

    <link rel="stylesheet" href="../style.css">
    <link rel="icon" href="../i.ico" type="image/x-icon">
</head>
<body>
    <h1>Page 8: Learning meta tags</h1>

    <p>there is nothing cool to see here unless you check the HTML file...</p>

        Return to Homepage
    </a>
</body>
</html>
